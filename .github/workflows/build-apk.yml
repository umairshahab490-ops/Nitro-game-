name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare Gradle wrapper and debug keystore
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --no-daemon
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_ROOT" ]; then
            SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
            if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
              yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-build.log

      - name: Publish failure details to summary
        if: failure()
        run: |
          {
            echo "### Build Debug APK Failure Log (Last 120 Lines)"
            echo '```text'
            if [ -f /tmp/gradle-build.log ]; then
              tail -n 120 /tmp/gradle-build.log
            else
              echo "Build log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/gradle-build.log ]; then
            ERR_SUMMARY=$(grep -m1 -E "(^Caused by:|^FAILURE:|^e: |Exception:|Error:)" /tmp/gradle-build.log | head -n 1 | tr -d '\r' || true)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 1 /tmp/gradle-build.log | tr -d '\r')
            fi
            echo "::error title=Build Debug APK failed::${ERR_SUMMARY}"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitro-rush-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
